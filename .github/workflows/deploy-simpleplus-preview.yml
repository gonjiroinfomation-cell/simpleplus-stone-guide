name: Deploy Simple+ Rebuild Preview

on:
  push:
    branches: [main]
    paths:
      - '.simpleplus-preview-staging/**'

permissions:
  contents: write

jobs:
  deploy-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild preview bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.simpleplus-preview-staging/part*.txt)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "No staging parts; nothing to do."
            exit 0
          fi
          cat "${parts[@]}" | base64 --decode > /tmp/simpleplus-preview.zip
          rm -rf /tmp/simpleplus-preview-unpack
          mkdir -p /tmp/simpleplus-preview-unpack
          unzip -q /tmp/simpleplus-preview.zip -d /tmp/simpleplus-preview-unpack
          test -f /tmp/simpleplus-preview-unpack/app/index.html
          rm -rf simpleplus-rebuild-preview
          mkdir -p simpleplus-rebuild-preview
          cp -a /tmp/simpleplus-preview-unpack/app/. simpleplus-rebuild-preview/
          rm -rf .simpleplus-preview-staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A simpleplus-rebuild-preview .simpleplus-preview-staging
          git commit -m "Deploy Simple+ Rebuild mobile preview"
          git push
